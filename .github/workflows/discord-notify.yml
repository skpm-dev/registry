name: Discord package notification

on:
  push:
    branches: [main]
    paths:
      - "packages/*.json"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Notify Discord for each changed package
        env:
          WEBHOOK: ${{ secrets.DISCORD_PACKAGES_WEBHOOK }}
        run: |
          changed=$(git diff-tree --no-commit-id -r --name-only HEAD | grep '^packages/.*\.json$' || true)
          [ -z "$changed" ] && exit 0

          for file in $changed; do
            # skip deleted files
            [ -f "$file" ] || continue
            pkg=$(cat "$file")
            name=$(echo "$pkg" | jq -r '.name')
            description=$(echo "$pkg" | jq -r '.description // "No description"')
            author=$(echo "$pkg" | jq -r '.author')
            version=$(echo "$pkg" | jq -r '.latest')
            url="https://skpm.org/package?name=${name}"

            # Determine new vs updated by checking if this file existed in the previous commit
            if git show HEAD~1:"$file" > /dev/null 2>&1; then
              prev_version=$(git show HEAD~1:"$file" | jq -r '.latest')
              if [ "$prev_version" = "$version" ]; then
                continue  # metadata-only change, not a version bump
              fi
              title="📦 ${name} updated to v${version}"
              color=3447003  # blue
            else
              title="🎉 ${name} v${version} published"
              color=5763719  # green
            fi

            payload=$(jq -n \
              --arg title "$title" \
              --arg url "$url" \
              --arg description "$description" \
              --arg author "$author" \
              --arg version "$version" \
              --argjson color "$color" \
              '{
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: $color,
                  fields: [
                    { name: "Author", value: $author, inline: true },
                    { name: "Version", value: $version, inline: true }
                  ],
                  footer: { text: "skpm registry" },
                  timestamp: (now | todate)
                }]
              }')

            curl -s -o /dev/null \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$WEBHOOK"
          done
